name: Package hex

# The Hex package in packages/elixir: its unit tests, and the package as Hex ships it in a fresh mix project.
on:
  push:
    branches: [main]
    paths: [tinyeval, packages/e2e.sh, 'packages/elixir/**', .github/workflows/package-hex.yml]
  pull_request:
    paths: [tinyeval, packages/e2e.sh, 'packages/elixir/**', .github/workflows/package-hex.yml]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/elixir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - run: mix deps.get
      - run: mix test
      - run: test/e2e.sh
