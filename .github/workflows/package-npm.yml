name: npm package

on:
  push:
    branches: [main]
    paths: [tinyeval, packages/e2e.sh, 'packages/npm/**', .github/workflows/package-npm.yml]
  pull_request:
    paths: [tinyeval, packages/e2e.sh, 'packages/npm/**', .github/workflows/package-npm.yml]

jobs:
  test:
    # Node 18 is the oldest the package supports.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', 'lts/*']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: test/e2e.sh
