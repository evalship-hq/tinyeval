name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS runs /bin/bash 3.2 with BSD tools, Ubuntu bash 5.2 with GNU tools, Windows Git Bash 5.3.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/test.sh
      - if: runner.os == 'Linux'
        run: shellcheck tinyeval install.sh
      - name: Installer
        run: |
          mkdir "$RUNNER_TEMP/repo" && cd "$RUNNER_TEMP/repo" && git init -q
          TINYEVAL_VERSION=$GITHUB_SHA sh "$GITHUB_WORKSPACE/install.sh"
          ./tinyeval
          "$HOME/.local/bin/tinyeval" # the command on PATH runs ./tinyeval

  # Busybox tools, and bash only once installed.
  alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/w" -w /w alpine:3.22 sh -c 'apk add --no-cache bash curl jq >/dev/null && bash test/test.sh'

  # The README's Ruby example against the real model and judge, once the repo has the ANTHROPIC_API_KEY secret.
  live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.ANTHROPIC_API_KEY != ''
        run: gem install --user-install --no-document anthropic && ./tinyeval -n 3 -j 4 examples/support.sh

  # Each worker in examples/workers, in its language. The image has the rest of the toolchains.
  workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4
      - run: REQUIRE_ALL=1 test/workers.sh
