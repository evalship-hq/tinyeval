name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS runs /bin/bash 3.2 with BSD tools, Ubuntu bash 5.2 with GNU tools, Windows Git Bash 5.3.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: test/test.sh
      - if: runner.os == 'Linux'
        run: shellcheck tinyeval install.sh
      - name: Installer
        run: |
          mkdir "$RUNNER_TEMP/repo" && cd "$RUNNER_TEMP/repo" && git init -q
          TINYEVAL_VERSION=$GITHUB_SHA sh "$GITHUB_WORKSPACE/install.sh"
          ./tinyeval
          "$HOME/.local/bin/tinyeval" # the command on PATH runs ./tinyeval

  # Busybox tools, and bash only once installed.
  alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/w" -w /w alpine:3.22 sh -c 'apk add --no-cache bash curl jq >/dev/null && bash test/test.sh'

  # The README's Ruby example against the real model and judge, once the repo has the ANTHROPIC_API_KEY secret.
  live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - if: env.ANTHROPIC_API_KEY != ''
        run: gem install --user-install --no-document anthropic && ./tinyeval -n 3 -j 4 examples/support.sh
