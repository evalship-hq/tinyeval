name: RubyGems package

on:
  push:
    branches: [main]
    paths:
      - tinyeval
      - packages/e2e.sh
      - packages/ruby/**
      - .github/workflows/package-rubygems.yml
  pull_request:
    paths:
      - tinyeval
      - packages/e2e.sh
      - packages/ruby/**
      - .github/workflows/package-rubygems.yml

jobs:
  test:
    # The oldest Ruby the gemspec allows, the latest, and Windows, where the command looks for Git for Windows' bash.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, ruby: '3.0'}
          - {os: ubuntu-latest, ruby: ruby}
          - {os: windows-latest, ruby: ruby}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: packages/ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: ruby -Ilib test/worker_test.rb
      - run: test/e2e.sh
