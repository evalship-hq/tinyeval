name: Release

# Pushing a tag like v0.3.0 publishes a release with tinyeval attached: install.sh, setup.md and
# tinyeval update download it from releases/latest. Then each registry's job publishes the same version, on its
# own: one that fails stops none of the others, and the summary job lists which did. packages/SPEC.md has the jobs.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the version in tinyeval
        run: grep -qx "_te_version=${GITHUB_REF_NAME#v}" tinyeval
      - run: test/test.sh
      - run: gh release create "$GITHUB_REF_NAME" tinyeval install.sh --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # One job per registry. A stub with `if: false` isn't built yet.

  # RubyGems, packages/ruby, through a trusted publisher for this workflow: no token.
  rubygems:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ruby
      - run: ruby -Ilib test/worker_test.rb
      - run: test/e2e.sh
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      # The gem's version is _te_version, which the release job checked against the tag.
      - name: Publish, unless RubyGems has this version
        run: |
          version=${GITHUB_REF_NAME#v}
          if curl -fs -o /dev/null "https://rubygems.org/api/v2/rubygems/tinyeval/versions/$version.json"; then
            echo "tinyeval $version is on RubyGems already"
          else
            gem build tinyeval.gemspec -o tinyeval.gem
            gem push tinyeval.gem
          fi

  # PyPI, packages/python, by trusted publishing. A version PyPI already has is skipped, so a re-run passes.
  pypi:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - run: bash packages/python/test.sh # leaves the wheel in packages/python/dist
        env:
          PYTHON: python
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: packages/python/dist
          skip-existing: true

  # npm, packages/npm, through trusted publishing: npm trusts this workflow, so no token.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/* # its npm is 11.5.1 or later, which trusted publishing needs
          registry-url: https://registry.npmjs.org
      - run: npm test && test/e2e.sh
      - name: Publish, unless npm has this version
        run: |
          v=${GITHUB_REF_NAME#v}
          if [ "$(npm view "tinyeval@$v" version 2>/dev/null)" = "$v" ]; then echo "npm has tinyeval $v"; exit 0; fi
          npm publish --provenance --access public

  # crates.io, packages/rust
  crates:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./prepare.sh && cargo test && ./e2e.sh
      - name: Whether crates.io has this version
        id: index
        run: |
          version=$(sed -n 's/^_te_version=//p' tinyeval)
          if curl -fsS https://index.crates.io/ti/ny/tinyeval | grep -q "\"vers\":\"$version\""; then
            echo "crates.io has tinyeval $version already"
            echo "published=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.index.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - if: steps.index.outputs.published != 'true'
        run: cargo publish --allow-dirty # prepare.sh's copies and version
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Hex, packages/elixir, with Hex's workload identity: no API key, as the job's OIDC token proves it's this workflow.
  hex:
    needs: release
    runs-on: ubuntu-latest
    environment: release # the environment the workload identity on hex.pm names
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/elixir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - run: mix deps.get
      - run: mix test
      - run: test/e2e.sh
      - name: Publish, unless Hex has this version
        run: |
          if curl -fs -o /dev/null "https://hex.pm/api/packages/tinyeval/releases/${GITHUB_REF_NAME#v}"; then
            echo "Hex has tinyeval ${GITHUB_REF_NAME#v} already"
          else
            mix hex.publish --yes
          fi

  # NuGet, packages/dotnet: Tinyeval, the worker library, and Tinyeval.Tool, the command. Trusted publishing swaps
  # this job's OIDC token for an API key that lasts an hour. --skip-duplicate passes a version nuget.org already has.
  nuget:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Tinyeval.Tests && ./e2e.sh # leaves both packages in dist/
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # the nuget.org profile name that owns the trusted publishing policy
      - run: dotnet nuget push "dist/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

  # pub.dev, packages/dart, by automated publishing: pub.dev trusts this repo's v{{version}} tags, so no token.
  pub:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: ./prepare.sh && dart pub get && dart test && test/e2e.sh
      - name: Whether pub.dev has this version
        id: pub
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          if curl -fs -o /dev/null "https://pub.dev/api/packages/tinyeval/versions/$version"; then
            echo "pub.dev has tinyeval $version already"
            echo "published=true" >>"$GITHUB_OUTPUT"
          fi
      # setup-dart again, for a fresh pub.dev token: they last about 5 minutes.
      - if: steps.pub.outputs.published != 'true'
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - if: steps.pub.outputs.published != 'true'
        run: dart pub publish --force

  # Go modules, go/: nothing to upload. The Go proxy reads the module from the go/vX.Y.Z tag, which this job puts on a
  # commit off main that adds the runner and LICENSE to go/, so main holds no second copy.
  go:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the tag
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: ./prepare.sh && go vet ./... && go test ./... && ./e2e.sh
      - name: Tag go/vX.Y.Z, unless the tag exists
        run: |
          tag=go/$GITHUB_REF_NAME
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag exists already"
          else
            git add -f LICENSE cmd/tinyeval/tinyeval # prepare.sh's copies
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "tinyeval ${GITHUB_REF_NAME#v} for Go modules"
            git tag "$tag" && git push origin "refs/tags/$tag"
          fi
      - name: Ask the Go proxy for it, so pkg.go.dev lists it
        run: curl -fsS --retry 3 --retry-all-errors "https://proxy.golang.org/github.com/evalship-hq/tinyeval/go/@v/$GITHUB_REF_NAME.info"

  # Packagist reads evalship-hq/tinyeval-php: this pushes packages/php there with the runner, tags it, and
  # Packagist's GitHub hook picks up the tag. A tag the mirror has already is skipped, so a re-run passes.
  packagist:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: latest
          tools: composer
          coverage: none
      - run: php test/worker_test.php
      - run: test/e2e.sh
      - run: ./mirror.sh "https://x-access-token:${MIRROR_TOKEN}@github.com/evalship-hq/tinyeval-php.git" "$GITHUB_REF_NAME"
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}

  # LuaRocks, packages/lua, with the LUAROCKS_API_KEY secret: LuaRocks has no trusted publishing. luarocks upload packs
  # the rockspec's source, this tag on GitHub, into a .src.rock and uploads both.
  luarocks:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: '5.4'
      - uses: leafo/gh-actions-luarocks@1c4a92caecc8f6850f673cbadfd57b3e555417ce # v6.1.1
      - run: packages/lua/test.sh # leaves tinyeval-X.Y.Z-1.rockspec in packages/lua
      - name: Publish, unless LuaRocks has this version
        working-directory: packages/lua
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          rockspec=tinyeval-${GITHUB_REF_NAME#v}-1.rockspec
          if curl -fs -o /dev/null "https://luarocks.org/$rockspec"; then
            echo "LuaRocks has $rockspec already"
          else
            luarocks upload --temp-key="$LUAROCKS_API_KEY" "$rockspec"
          fi

  # Maven Central, packages/jvm
  maven:
    needs: release
    if: false # not built yet
    runs-on: ubuntu-latest
    steps: [{run: 'false'}]

  # SwiftPM and the Swift Package Index read evalship-hq/tinyeval-swift: this pushes packages/swift there with the
  # runner, and tags it X.Y.Z, without the v, as Swift packages tag. The Index finds new tags on its own. A tag the
  # mirror has already is skipped, so a re-run passes.
  swift:
    needs: release
    runs-on: ubuntu-latest # Swift comes preinstalled
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./test.sh
      - run: ./mirror.sh "https://x-access-token:${MIRROR_TOKEN}@github.com/evalship-hq/tinyeval-swift.git" "$GITHUB_REF_NAME"
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}

  # R-universe, packages/r
  # R-universe builds packages/r from this repo's r-universe branch, on its own schedule: the packages.json in
  # evalship-hq/evalship-hq.r-universe.dev says so. This tests the package, then points that branch at a commit of this
  # tag with prepare.sh's copies. A branch with this version or a newer one is left alone, so a re-run passes.
  r-universe:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the r-universe branch
    defaults:
      run:
        working-directory: packages/r
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./prepare.sh
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: packages/r
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: packages/r
      - run: ./e2e.sh
      - name: Point the r-universe branch at this release, unless it has this version or a newer one
        run: |
          version=${GITHUB_REF_NAME#v}
          have=$(git fetch -q origin r-universe 2>/dev/null && git show FETCH_HEAD:packages/r/DESCRIPTION | sed -n 's/^Version: //p' || true)
          if [ -n "$have" ] && [ "$(printf '%s\n' "$version" "$have" | sort -V | tail -n1)" = "$have" ]; then
            echo "The r-universe branch has tinyeval $have already"
          else
            git add -f inst/tinyeval DESCRIPTION # prepare.sh's copy and version
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "tinyeval $version for R-universe"
            git push -f origin HEAD:refs/heads/r-universe
            echo "::notice::R-universe builds tinyeval $version on its own: https://github.com/r-universe/evalship-hq/actions"
          fi

  # Homebrew, packages/homebrew: writes the tag's source tarball into the formula and pushes it to
  # evalship-hq/homebrew-tap. A tap with this version already is skipped, so a re-run passes.
  homebrew:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: packages/homebrew/test.sh
      - run: packages/homebrew/tap.sh "https://x-access-token:${MIRROR_TOKEN}@github.com/evalship-hq/homebrew-tap.git" "$GITHUB_REF_NAME"
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}

  # GitHub Actions Marketplace lists evalship-hq/tinyeval-action: this pushes packages/action there with the runner,
  # tags it, moves the major tag, and releases the tag, which the Marketplace lists. A tag or release the mirror has
  # already is skipped, so a re-run passes.
  action:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: packages/action/test/e2e.sh
      - run: packages/action/mirror.sh "https://x-access-token:${MIRROR_TOKEN}@github.com/evalship-hq/tinyeval-action.git" "$GITHUB_REF_NAME"
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
      - name: Release the tag on the mirror, unless it has the release
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          repo=evalship-hq/tinyeval-action
          if gh release view "$GITHUB_REF_NAME" -R "$repo" >/dev/null 2>&1; then
            echo "$repo has the $GITHUB_REF_NAME release already"
          else
            gh release create "$GITHUB_REF_NAME" -R "$repo" --verify-tag --title "tinyeval ${GITHUB_REF_NAME#v}" \
              --notes "https://github.com/evalship-hq/tinyeval/releases/tag/$GITHUB_REF_NAME"
          fi

  # Which registries have this version. Run the failed ones again with: gh run rerun RUN_ID --failed
  summary:
    needs: [release, rubygems, pypi, npm, crates, hex, nuget, pub, go, packagist, luarocks, maven, swift, r-universe, homebrew, action]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<<"$NEEDS")
          {
            echo "### tinyeval ${GITHUB_REF_NAME#v}"
            echo
            echo '| Job | Result |'
            echo '|---|---|'
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS"
            [ -z "$failed" ] || printf '\nNot published: %s\n' "$failed"
          } >>"$GITHUB_STEP_SUMMARY"
          [ -z "$failed" ] || { echo "::error::Not published: $failed"; exit 1; }
