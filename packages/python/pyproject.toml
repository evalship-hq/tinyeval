[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tinyeval"
dynamic = ["version"]
description = "Test your Python app's AI calls with evals in a short bash file."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://tinyeval.com"
Source = "https://github.com/evalship-hq/tinyeval"

[project.scripts]
tinyeval = "tinyeval.__main__:main"

# The runner is the repo's tinyeval file, copied into the wheel, and its _te_version is the package's version.
# PyPI gets the wheel only (pip wheel, or uv build --wheel): a wheel built from an sdist can't reach ../../tinyeval.
[tool.hatch.version]
path = "../../tinyeval"
pattern = "^_te_version=(?P<version>.+)$"

[tool.hatch.build.targets.wheel.force-include]
"../../tinyeval" = "tinyeval/tinyeval"
